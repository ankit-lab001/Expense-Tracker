
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Expense</title>

<style>

*{
box-sizing:border-box;
font-family:Arial;
}

body{
margin:0;
min-height:100vh;
background:linear-gradient(135deg,#ede9fe,#fce7f3,#dbeafe);
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

body::before,
body::after{
content:"";
position:absolute;
border-radius:50%;
background:rgba(124,58,237,.15);
filter:blur(5px);
}

body::before{
width:300px;
height:300px;
left:-80px;
top:-80px;
}

body::after{
width:250px;
height:250px;
right:-60px;
bottom:-60px;
}

.container{
width:430px;
background:rgba(255,255,255,.92);
backdrop-filter:blur(20px);
padding:35px;
border-radius:25px;
box-shadow:0 25px 60px rgba(0,0,0,.18);
animation:popup .8s ease;
position:relative;
z-index:2;
}

h1{
text-align:center;
color:#5b21b6;
margin-bottom:25px;
}

.input-box{
margin-top:18px;
}

label{
font-weight:bold;
color:#374151;
display:block;
margin-bottom:7px;
}

input,select{
width:100%;
padding:13px;
border:2px solid #e5e7eb;
border-radius:12px;
outline:none;
font-size:15px;
transition:.3s;
}

input:focus,
select:focus{
border-color:#7c3aed;
box-shadow:0 0 0 4px rgba(124,58,237,.12);
}

button{
width:100%;
margin-top:28px;
padding:15px;
border:none;
border-radius:30px;
background:linear-gradient(135deg,#6d28d9,#ec4899);
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-3px);
box-shadow:0 12px 25px rgba(124,58,237,.35);
}

.back{
display:block;
text-align:center;
margin-top:20px;
text-decoration:none;
color:#6d28d9;
font-weight:bold;
}

.icon{
font-size:55px;
text-align:center;
animation:float 3s infinite;
}

@keyframes popup{
from{
opacity:0;
transform:scale(.8) translateY(40px);
}
to{
opacity:1;
transform:scale(1);
}
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-10px);}
}

</style>
</head>

<body>

<div class="container">

<div class="icon">💸</div>

<h1 th:text="${expense.id == null ? 'Add New Expense' : 'Edit Expense'}"></h1>

<form th:action="${expense.id == null} ? '/save-expense' : '/update-expense'" method="post">

<input type="hidden" name="id" th:value="${expense.id}">

<div class="input-box">
<label>Description</label>
<input type="text" name="description" th:value="${expense.description}" placeholder="Lunch, Petrol, Books..." required>
</div>

<div class="input-box">
<label>Category</label>

<select name="category" required>

<option value="">Choose Category</option>

<option value="Food" th:selected="${expense.category=='Food'}">🍔 Food</option>
<option value="Travel" th:selected="${expense.category=='Travel'}">🚗 Travel</option>
<option value="Shopping" th:selected="${expense.category=='Shopping'}">🛍 Shopping</option>
<option value="Education" th:selected="${expense.category=='Education'}">📚 Education</option>
<option value="Bills" th:selected="${expense.category=='Bills'}">💡 Bills</option>
<option value="Other" th:selected="${expense.category=='Other'}">📦 Other</option>

</select>
</div>

<div class="input-box">
<label>Amount (₹)</label>
<input type="number" step="0.01" name="amount" th:value="${expense.amount}" placeholder="Enter amount" required>
</div>

<div class="input-box">
<label>Date</label>
<input type="date" name="date" th:value="${expense.date}" required>
</div>

<button type="submit"
th:text="${expense.id == null ? 'Save Expense' : 'Update Expense'}">
Save Expense
</button>

</form>

<a href="/" class="back">← Back to Dashboard</a>

</div>

</body>
</html>
